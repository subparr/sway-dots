[env]
"EDITOR" = "nvim"
"TERMINAL" = "foot"

[global]

#matugen styling, anything related to appearance is edited in matugen template
source_optional = ["./style.toml"]

# Execs

exec_once = ["mangobar",
			 "dunst",
			 "wob",
			 "mkfifo /tmp/wobpipe && tail -f /tmp/wobpipe | wob",
			 "awww-daemon",
			 "wl-paste --type text --watch cliphist -max-items 1 store",
			 "wl-paste --type image --watch cliphist -max-items 1 store"
]

# Window effects
blur = 0

shadows = 0

border_px = 3
border_radius = 0
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0
dim_enable = 0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations = 1
layer_animations = 0

circle_layout = ["tile", "scroller", "vertical_grid", "dwindle"] 

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.7
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Master-Stack Layout Setting
new_is_master = 0
default_master_factor = 0.78
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0

# Deck Layout Setting
deck_tab_mode = 0

# Overview Setting
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 0
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 0
cursor_hide_timeout = 60
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
float_full_to_top = 0
cursor_size = 16
drag_tile_to_tile = 0
drag_tile_small = 0

# keyboard
repeat_rate = 40
repeat_delay = 230
numlock_on = 0
xkb_rules_layout = "us, ru"
 xkb_rules_options=grp:lalt_lshift_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# mouse
# need relogin to make it apply <- the dev lied, no you don't
mouse_natural_scrolling = 0

[bind.default.release]
"Super+Super_L" = "spawn_shell,pkill -x fuzzel || exec fuzzel -T foot"

[bind.default]

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
# reload config
"SUPER+SHIFT+r" = "reload_config"

# menu and terminal and misc
"SUPER+Return" = "spawn,foot"
"SUPER+t" = "spawn,foot"
"SUPER+Shift+w" = "spawn, foot --title "change wp" ~/.config/mango/wp_change.sh"

# misc
"CTRL+grave" = 'spawn_shell,grim - | wl-copy --type image/png'
"CTRL+SHIFT+grave" =  'spawn_shell,grim -g "$(slurp)" - | wl-copy --type image/png'
"XF86AudioRaiseVolume" = "spawn, ~/.config/mango/vol_limit.sh up"
"XF86AudioLowerVolume" = "spawn, ~/.config/mango/vol_limit.sh down"
"XF86AudioMute" = "spawn, pactl set-sink-mute @DEFAULT_SINK@ toggle"
"XF86MonBrightnessUp" = "spawn_shell, brightnessctl set +5% && brightnessctl -m | grep -oP '[0-9]+(?=%)' > /tmp/wobpipe"
"XF86MonBrightnessDown" = "spawn_shell, brightnessctl set 5%- && brightnessctl -m | grep -oP '[0-9]+(?=%)' > /tmp/wobpipe"

# exit
"SUPER+q" = "killclient,"

# switch window focus
"SUPER+Tab" = "focuslast,next"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# move windows
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"


# switch window status
"SUPER+g" = "toggleglobal,"
"SUPER+Space" = "togglefloating,"
"SUPER+f" = "togglefullscreen,"


# switch layout
"SUPER+n" = "switch_layout"

# tag switch
#"SUPER+Left" = "viewtoleft,0"
#"CTRL+Left" = "viewtoleft_have_client,0"
#"SUPER+Right" = "viewtoright,0"
#"CTRL+Right" = "viewtoright_have_client,0"
#"CTRL+SUPER+Left" = "tagtoleft,0"
#"CTRL+SUPER+Right" = "tagtoright,0"
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
"SUPER+0" = "view,0,0"

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
"SUPER+Shift+1" = "tagsilent,1,0"
"SUPER+Shift+2" = "tagsilent,2,0"
"SUPER+Shift+3" = "tagsilent,3,0"
"SUPER+Shift+4" = "tagsilent,4,0"
"SUPER+Shift+5" = "tagsilent,5,0"
"SUPER+Shift+6" = "tagsilent,6,0"
"SUPER+Shift+7" = "tagsilent,7,0"
"SUPER+Shift+8" = "tagsilent,8,0"
"SUPER+Shift+9" = "tagsilent,9,0"

#TODO!()
# movewin
"CTRL+SHIFT+Up" = "movewin,+0,-50"
"CTRL+SHIFT+Down" = "movewin,+0,+50"
"CTRL+SHIFT+Left" = "movewin,-50,+0"
"CTRL+SHIFT+Right" = "movewin,+50,+0"

#Modes
"SUPER+r" = "setkeymode,resize"


[bind.resize]
# Window Resizing
"SUPER+j" = "resizewin,0,30"
"SUPER+k" = "resizewin,0,-30"
"SUPER+h" = "resizewin,-30,0"
"SUPER+l" = "resizewin,30,0"

# gaps
"SUPER+SHIFT+X" = "incgaps,1"
"SUPER+SHIFT+Z" = "incgaps,-1"
"SUPER+g" = "togglegaps"

# exit back to default mode
"SUPER+r" = "setkeymode,default"
"NONE+Escape" = "setkeymode,default"

[bind.default.conflict]
"SUPER+SHIFT+j" = ["scroller_stack,left", "move_client,down"]
"SUPER+SHIFT+k" = ["scroller_stack,right", "move_client,up"]

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
#cur in use
# circle_layout = ["tile", "scroller", "vertical_grid", "dwindle" ] 

[[rule.tag_rule]]
id = 1
layout_name = "tile"

[[rule.tag_rule]]
id = 2
layout_name = "tile"

[[rule.tag_rule]]
id = 3
layout_name = "scroller"

[[rule.tag_rule]]
id = 4
layout_name = "tile"

[[rule.tag_rule]]
id = 5
layout_name = "dwindle"

[[rule.tag_rule]]
id = 6
layout_name = "dwindle"

[[rule.tag_rule]]
id = 7
layout_name = "dwindle"

[[rule.tag_rule]]
id = 8
layout_name = "dwindle"

[[rule.tag_rule]]
id = 9
layout_name = "dwindle"

[[rule.tag_rule]]
id = 0
layout_name = "dwindle"

# window rules
[[rule.window_rule]]
app_id = "librewolf"
tags = 1
is_open_silent = true

# 2 3 is code and related, no rules needed

[[rule.window_rule]]
app_id = "vesktop"
tags = 4
is_open_silent = true

[[rule.window_rule]]
app_id = "concord"
tags = 4
is_open_silent = true

[[rule.window_rule]]
app_id = "steam"
tags = 5
is_open_silent = true

[[rule.window_rule]]
app_id = "prismlauncher"
tags = 5
is_open_silent = true

#floating
[[rule.window_rule]]
title = "change wp"
is_floating = 1
width = 700
height = 500
