theme = "matugen"

#set up autocompletions
[editor]
line-number = "relative"
mouse = false
middle-click-paste = false
auto-completion = false
auto-format = false

#false when acclimated
auto-info = true
color-modes = true
#recheck tf it even does
bufferline = "never"
cursorline = true

[editor.cursor-shape]
insert = "bar"
select = "underline"

[editor.statusline]
left = ["mode", "file-name", "file-modification-indicator", "read-only-indicator", "version-control"]
center = []
right = ["selections", "file-type", "position-percentage", "position"]

[editor.lsp]
auto-signature-help = false
display-messages = true
display-inlay-hints = false

[editor.smart-tab]
enable = false

[editor.auto-pairs]
'(' = ')'
'{' = '}'
'[' = ']'
'"' = '"'
'`' = '`'
'<' = '>'

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
V = "extend_line_below"
"C-j" = "copy_selection_on_next_line"
"C-k" = "copy_selection_on_prev_line"
# LSP docs popup scroll with C-u / C-d (hardcoded, not remappable), Esc closes
K = "hover"

y = "yank_to_clipboard"
d = ["yank_to_clipboard", "delete_selection_noyank"]
c = ["yank_to_clipboard", "change_selection_noyank"]
p = "paste_clipboard_after"
P = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
# blank line below/above, stay in normal mode
ret = ["open_below", "normal_mode"]
S-ret = ["open_above", "normal_mode"]

[keys.normal.space]
R = "rename_symbol"
e = [
  ':sh rm -f ${XDG_RUNTIME_DIR:-/tmp}/hx-yazi',
  ':insert-output yazi %{buffer_name} --chooser-file=${XDG_RUNTIME_DIR:-/tmp}/hx-yazi',
  ':sh printf "\033[?1049h\033[?2004h" > /dev/tty',
  ':open %sh{cat ${XDG_RUNTIME_DIR:-/tmp}/hx-yazi}',
  ':redraw',
]

[keys.normal.space.r]
r = [
  "keep_primary_selection",
  ':pipe-to mkdir -p $HOME/.cache/helix && cd $(dirname %{buffer_name}) && cargo run </dev/null >$HOME/.cache/helix/cargo.log 2>&1',
  ':hsplit ~/.cache/helix/cargo.log',
  ':reload',
]
l = [
  "keep_primary_selection",
  ':pipe-to mkdir -p $HOME/.cache/helix && cd $(dirname %{buffer_name}) && cargo clippy </dev/null >$HOME/.cache/helix/cargo.log 2>&1',
  ':hsplit ~/.cache/helix/cargo.log',
  ':reload',
]

# select mode does not inherit normal and overrides
[keys.select]
esc = ["collapse_selection", "keep_primary_selection", "normal_mode"]
V = "extend_line_below"
"C-j" = "copy_selection_on_next_line"
"C-k" = "copy_selection_on_prev_line"
y = "yank_to_clipboard"
d = ["yank_to_clipboard", "delete_selection_noyank"]
c = ["yank_to_clipboard", "change_selection_noyank"]
p = "paste_clipboard_after"
P = "paste_clipboard_before"
R = "replace_selections_with_clipboard"
