[config]
version_check = false
[templates.mango]
input_path = '~/.config/matugen/templates/mango-template'
output_path = '~/.config/mango/style.toml'
[templates.mangobar]
input_path = '~/.config/matugen/templates/mangobar-template'
output_path = '~/.config/mangobar/style.css'
post_hook = 'pkill -x mangobar; mmsg dispatch spawn,mangobar'
[templates.btop]
input_path = 'templates/btop-template'
output_path = '~/.config/btop/themes/matugen.theme'
[templates.dunst]
input_path = 'templates/dunst-template'
output_path = '~/.config/dunst/dunstrc'
post_hook = 'dunstctl reload'
[templates.fish]
input_path = 'templates/fish-template'
output_path = '~/.config/fish/colors.fish'
[templates.fastfetch]
input_path = 'templates/fastfetch-template'
output_path = '~/.config/fastfetch/config.jsonc'
[templates.neovim]
input_path = 'templates/nvim-template'
output_path = '~/.config/nvim/generated.lua'
post_hook = 'pkill -SIGUSR1 nvim'
[templates.yazi]
input_path = '~/.config/matugen/templates/yazi-template'
output_path = '~/.config/yazi/theme.toml'
[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel-template'
output_path = '~/.config/fuzzel/fuzzel.ini'

